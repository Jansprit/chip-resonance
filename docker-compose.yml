version: '3.8'

# docker compose for chip-resonance pipeline
# 用法：
#   cp backend/.env.example backend/.env && vi backend/.env
#   docker compose build
#   docker compose up -d                  # 啟動 cron 容器
#   docker compose logs -f                # 查看排程輸出
#   docker compose exec chip-resonance python -m backend.scripts.auth_setup --site pyramid

services:
  chip-resonance:
    build: .
    image: chip-resonance:latest
    container_name: chip-resonance-cron
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
      - CHIP_RESONANCE_ENV=/app/backend/.env
    env_file:
      - ./backend/.env
    volumes:
      # 持久化資料快照
      - ./data:/app/data
      # 持久化 session cookies（Playwright 用）
      - ./backend/.sessions:/app/backend/.sessions
      # Pipeline debug 用 raw HTML
      - chip-resonance-debug:/app/backend/data/local
      # 讓 host 可以直接 git push（可選）
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - ${HOME}/.ssh:/root/.ssh:ro
    command: >
      sh -c "
        echo 'chip-resonance pipeline started at $$(date)' &&
        while true; do
          HOUR=$$(date +%H)
          MIN=$$(date +%M)
          TODAY=$$(date +%Y%m%d)
          # BUG-08 重入保護：
          # 舊版用 MIN >= 30 && MIN <= 35 判斷，配合 sleep 60，
          # 會在 6 分鐘窗口內重複執行最多 6 次（每天多打 5 次站台）。
          # 改成「以日期命名的一次性 lock 檔」，每個窗口每天只會跑一次。
          if [ $$HOUR -eq 13 ] && [ $$MIN -ge 30 ] && [ $$MIN -le 35 ]; then
            LOCK=/app/data/.cron-$$TODAY-1330.lock
            if [ ! -f $$LOCK ]; then
              touch $$LOCK
              echo '[cron] Running public subset at $$(date)'
              python3 -m backend.scripts.run_local --source public 2>&1 | tee /app/data/cron.log
              # 合併 → 因子庫 → 回測報告（順序不可調換）
              python3 backend/scripts/build_universe.py 2>&1 | tee -a /app/data/cron.log
              node backend/scripts/emit_factors.js 2>&1 | tee -a /app/data/cron.log
              python3 -m backend.scripts.run_backtest --weeks 4 2>&1 | tee -a /app/data/cron.log
            fi
          fi
          if [ $$HOUR -eq 14 ] && [ $$MIN -ge 30 ] && [ $$MIN -le 35 ] && [ $$(date +%u) -eq 5 ]; then
            LOCK=/app/data/.cron-$$TODAY-1430.lock
            if [ ! -f $$LOCK ]; then
              touch $$LOCK
              # 週五 14:30 跑完整 pipeline（含 Playwright 源）
              echo '[cron] Running full pipeline at $$(date)'
              python3 -m backend.scripts.run_local --source all 2>&1 | tee /app/data/cron.log
              python3 backend/scripts/build_universe.py 2>&1 | tee -a /app/data/cron.log
              node backend/scripts/emit_factors.js 2>&1 | tee -a /app/data/cron.log
              python3 -m backend.scripts.run_backtest --weeks 4 2>&1 | tee -a /app/data/cron.log
            fi
          fi
          # 玩股網的歷史 K 線對 datacenter IP 會回 403（CI 跑不動），
          # 所以價格歷史只能靠本機排程更新。
          # 跑完後可選地把新資料推回 GitHub，讓線上網站同步更新。
          # 開關：環境變數 PUSH_TO_GITHUB=true（且容器內有 git 憑證）
          if [ \"$${PUSH_TO_GITHUB:-false}\" = \"true\" ] && [ $$HOUR -eq 14 ] && [ $$MIN -eq 35 ]; then
            echo '[cron] Pushing refreshed data to GitHub'
            git add data/latest/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git -c user.name='chip-resonance-bot' -c user.email='bot@example.com' \
                commit -m 'data: refresh from local pipeline (price history + factors + backtest)' && \
              git push 2>&1 | tee -a /app/data/cron.log
            else
              echo '[cron] No data changes to push'
            fi
          fi
          sleep 60
        done
      "

volumes:
  chip-resonance-debug: