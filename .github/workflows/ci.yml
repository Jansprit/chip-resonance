name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project structure & syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) 檔案結構檢查 — 確認所有 9+ 個關鍵檔案都存在且非空
      - name: File structure check
        run: |
          echo "=== File structure check ==="
          missing=0
          for f in LICENSE README.md \
                   index.html factors.html scoring.html backtest.html \
                   app.js data.js styles.css .gitignore; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty file: $f"
              missing=1
            else
              size=$(stat -c%s "$f")
              printf "  %-20s %8d bytes\n" "$f" "$size"
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::error::One or more required files are missing."
            exit 1
          fi
          echo "All required files present."

      # 2) HTML well-formedness 檢查 — 用 Python html.parser 確認 4 個 HTML 檔案至少語法正確
      - name: HTML well-formedness check
        run: |
          echo "=== HTML well-formedness check ==="
          python3 - <<'PY'
          import sys
          from html.parser import HTMLParser

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.errors = []
              def error(self, msg):
                  self.errors.append(msg)

          files = ['index.html', 'factors.html', 'scoring.html', 'backtest.html']
          ok = True
          for f in files:
              try:
                  with open(f, encoding='utf-8') as fh:
                      content = fh.read()
                  c = Checker()
                  c.feed(content)
                  if c.errors:
                      print(f"  ::error::{f}: parse errors: {c.errors}")
                      ok = False
                  else:
                      print(f"  {f}: OK ({len(content)} bytes)")
              except Exception as e:
                  print(f"  ::error::{f}: {e}")
                  ok = False
          if not ok:
              sys.exit(1)
          PY

      # 3) JavaScript 語法檢查 — 用 Node.js `node --check` 對所有 JS 檔案
      - name: JavaScript syntax check
        run: |
          echo "=== JavaScript syntax check ==="
          for f in app.js data.js; do
            node --check "$f" && echo "  $f: syntax OK"
          done

      # 4) 連結檢查 — 用 lychee 確認 README 與 docs 內部連結有效
      - name: Link check (markdown & HTML)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency=4 --accept 200,206,403,429 --timeout 10 --exclude-loopback README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}