name: Scrape & Update Data

on:
  # 每日 13:30 UTC+8（盤後），週一~週五
  schedule:
    - cron: '30 5 * * 1-5'
  # 手動觸發
  workflow_dispatch:
    inputs:
      source:
        description: '要抓取的單一來源 (all = 全部)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - twse

permissions:
  contents: write   # 寫回 repo

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    name: Scrape TWSE + Update data/latest/*.json
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 安全上限；TWSE 跑完整市場約 3 分鐘
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pipeline
        env:
          RL_JITTER: '1.0'   # 加點抖動避免週期性 fingerprint
        run: |
          python -m backend.scripts.run_local --source ${{ github.event.inputs.source || 'all' }}

      - name: Validate JSON shape
        if: always()
        run: |
          python -m backend.schema data/latest/prices.json
          python -m backend.schema data/latest/market_index.json
          python -m backend.schema data/latest/_meta.json

      - name: Commit & push (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest/ data/$(date -d "today" +%Y-%m-%d)/ 2>/dev/null || git add data/latest/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh from TWSE OpenAPI $(date +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Run time: $(date)" >> $GITHUB_STEP_SUMMARY
          if [ -f data/latest/_meta.json ]; then
            echo "- Last update (Taipei): $(jq -r '.last_update_taipei' data/latest/_meta.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Stocks: $(jq -r '.sources.twse.stocks_count' data/latest/_meta.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Indices: $(jq -r '.sources.twse.indices_count' data/latest/_meta.json)" >> $GITHUB_STEP_SUMMARY
          fi