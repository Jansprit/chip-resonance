name: Scrape & Update Public Data

# 公開資料子集 GitHub Actions 排程（TWSE + TPEx + FinMind + MOPS）
# 不含 Playwright 類的來源（神秘金字塔 / Goodinfo / 集保），這些由本地 Docker / Windows Task 跑

on:
  schedule:
    # 週一到週五 13:30 UTC+8（盤後 30 分鐘）
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
    inputs:
      source:
        description: '要抓取的單一來源'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - twse
          - tpex
          - finmind
          - mops

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    name: Scrape public data sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          sudo apt-get install -y nodejs || (which node || echo "Node not available, will fallback to demo_subset.json")

      - name: Run pipeline (public subset)
        env:
          RL_JITTER: '1.0'
        run: |
          python -m backend.scripts.run_local --source ${{ github.event.inputs.source || 'public' }}

      - name: Rebuild universe with real prices
        run: |
          python backend/scripts/build_universe.py

      - name: Validate JSON shape
        if: always()
        run: |
          python -m pip install --quiet pydantic
          python -m backend.schema data/latest/prices.json || true
          python -m backend.schema data/latest/tpex_prices.json || true
          python -m backend.schema data/latest/market_index.json || true
          python -m backend.schema data/latest/demo_subset.json || true
          python -m backend.schema data/latest/universe.json || true
          python -m backend.schema data/latest/meta.json

      - name: Commit & push (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest/ data/$(date -d "today" +%Y-%m-%d)/ 2>/dev/null || git add data/latest/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh public subset $(date +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f data/latest/meta.json ]; then
            echo "- Last update (Taipei): $(jq -r '.last_update_taipei' data/latest/meta.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Snapshot: $(jq -r '.snapshot_date' data/latest/meta.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Sources: $(jq -r '.sources | keys | join(\", \")' data/latest/meta.json)" >> $GITHUB_STEP_SUMMARY
          fi