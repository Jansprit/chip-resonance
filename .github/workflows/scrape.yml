name: Scrape & Update Public Data

# 公開資料子集 GitHub Actions 排程
# public 集合 = TWSE + TPEx + FinMind + MOPS + 集保開放平台
#   → 全部是純 HTTP 的政府 / 官方開放 API，不需要瀏覽器、不需要登入。
#   → 這是 CI 唯一該跑的集合（BUG-04：tdcc_opendata 原本從沒在 CI 執行過）。
# private 集合 = Wantgoo / MoneyDJ / Goodinfo
#   → 需要 Playwright 或登入 session，由本地 Docker / Windows Task 執行。

on:
  schedule:
    # 週一到週五 13:30 UTC+8（盤後 30 分鐘）
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
    inputs:
      source:
        description: '要抓取的單一來源'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - twse
          - tpex
          - finmind
          - mops
          - tdcc

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    name: Scrape public data sources
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pipeline (public subset)
        env:
          RL_JITTER: '1.0'
          PIPELINE_LIMIT: '20'
        run: |
          python -m backend.scripts.run_local --source ${{ github.event.inputs.source || 'public' }}

      - name: Merge real sources into demo_subset (provenance)
        run: |
          python backend/scripts/build_universe.py

      # BUG-07：舊版 5 個驗證都帶 `|| true`，壞掉的資料永遠不會讓 workflow 失敗。
      # 現在全部改成會擋下；`if: always()` 保留，讓 pipeline 失敗時也能驗證已產生的檔案。
      - name: Validate JSON shape
        if: always()
        run: |
          python -m backend.schema data/latest/prices.json
          python -m backend.schema data/latest/tpex_prices.json
          python -m backend.schema data/latest/market_index.json
          python -m backend.schema data/latest/universe.json
          python -m backend.schema data/latest/demo_subset.json
          python -m backend.schema data/latest/meta.json

      # 只在對應來源的檔案存在時才驗證（單一來源排程時不會有全部檔案）
      - name: Validate source outputs (if present)
        if: always()
        run: |
          for f in tdcc_chip.json mops_director.json mops_pledge.json pyramid_price.json tdcc_history_public.json; do
            if [ -f "data/latest/$f" ]; then
              echo "--- $f"
              python -m backend.schema "data/latest/$f"
            fi
          done

      - name: Check provenance (real data actually reaches the scoring engine)
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("data/latest/demo_subset.json")
          if not p.exists():
              print("FAIL: demo_subset.json 不存在")
              sys.exit(1)
          rows = json.loads(p.read_text(encoding="utf-8"))
          if not rows:
              print("FAIL: demo_subset.json 是空的")
              sys.exit(1)
          prov = rows[0].get("_provenance", {})
          real = [k for k, v in prov.items() if v == "real"]
          print(f"第一檔的真實欄位：{sorted(real)}")
          # 至少要有價格是真實的，否則合併層根本沒運作
          if "price" not in real:
              print("FAIL: demo_subset.json 的 price 不是 real，合併層可能沒跑")
              sys.exit(1)
          PY

      - name: Commit & push (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只提交 data/latest/：每日全市場快照留在本機（見 .gitignore），
          # 否則公開倉庫會以每日數 MB 的速度膨脹。
          git add data/latest/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh public subset $(date +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f data/latest/meta.json ]; then
            echo "- Last update (Taipei): $(jq -r '.last_update_taipei' data/latest/meta.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Snapshot: $(jq -r '.snapshot_date' data/latest/meta.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Sources:" >> $GITHUB_STEP_SUMMARY
            jq -r '.sources | to_entries[] | "  - \(.key): \(.value.status)"' data/latest/meta.json >> $GITHUB_STEP_SUMMARY
          fi
